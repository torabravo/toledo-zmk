# NOTE: BT_MAX_CONN / BT_MAX_PAIRED are deliberately NOT set here.
# This file is shared by every part of the keyboard (left, right, dongle),
# and each role needs a different value:
#   central/dongle -> set in Kconfig.defconfig per shield
#   peripherals    -> ZMK defaults them to 1 (app/src/split/bluetooth/Kconfig)
# Setting them here would override all of that with one wrong number.

CONFIG_ZMK_IDLE_TIMEOUT=30000
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=1800
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

CONFIG_ZMK_USB=y
CONFIG_ZMK_BLE=y

CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
