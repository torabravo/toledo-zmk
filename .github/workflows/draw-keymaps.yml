# Draw keymap diagrams using keymap-drawer ZMK user config workflow
name: Draw ZMK keymaps
on:
  workflow_dispatch:
  push:
    paths:
      - 'config/*.keymap'
      - 'config/includes/*.dtsi'
      - 'keymap-drawer/layouts/*.json'
      - keymap-drawer/config.yaml
      - .github/workflows/draw-keymaps.yml

jobs:
  draw:
    uses: caksoylar/keymap-drawer/.github/workflows/draw-zmk.yml@main
    with:
      keymap_patterns: 'config/*.keymap'
      config_path: keymap-drawer/config.yaml
      output_folder: keymap-drawer
      install_branch: main
      amend_commit: true
      # No layout specifier in draw_args on purpose: that would make the
      # workflow skip json_path entirely (see check_for_layout_args in
      # caksoylar/keymap-drawer draw-zmk.yml). Leaving it empty lets it pick up
      # keymap-drawer/layouts/toledo.json, which has the real rotated thumbs.
      json_path: keymap-drawer/layouts
